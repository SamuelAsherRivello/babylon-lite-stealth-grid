<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Babylon Lite Stealth Grid</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <main class="stage" aria-label="Babylon Light Stealth Grid game">
      <div class="game-frame">
        <canvas
          id="renderCanvas"
          width="576"
          height="1024"
          aria-label="Tiny Swords movement demo"
        ></canvas>
        <canvas
          id="debugCanvas"
          width="576"
          height="1024"
          data-terrain-frame-count="54"
          aria-hidden="true"
        ></canvas>
      </div>
      <div id="uiLayer" class="ui-layer">
        <section id="gameUi" class="game-ui" aria-live="polite"></section>
        <div id="coordinates-ui" class="coordinates-ui" aria-label="Archer coordinates" hidden>
          <output id="coordinates-ui-pixel">X 288 · Y 512</output>
          <output id="coordinates-ui-grid">C 3 · R 7</output>
        </div>
        <div class="virtual-controller" aria-label="Virtual controller">
          <div class="movement-control action-control-layout">
            <button
              id="movement-joystick"
              class="joystick"
              type="button"
              aria-label="Move joystick"
            >
              <span id="movement-puck" class="control-puck" aria-hidden="true"></span>
            </button>
            <span class="control-label">Move (Keys)</span>
          </div>
          <div class="action-controls" aria-label="Player actions">
            <button id="item-action" class="action-control" type="button">
              <span class="action-symbol" aria-hidden="true">&#9632;</span>
              <span class="control-label">Item (C)</span>
            </button>
            <button id="attack-action" class="action-control" type="button">
              <span class="action-symbol" aria-hidden="true">&#10148;</span>
              <span class="control-label">Attack (V)</span>
            </button>
          </div>
        </div>
        <p id="error" class="error" role="alert"></p>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
